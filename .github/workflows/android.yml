name: Build VichGram APK and publish release

run-name: VichGram APK build #${{ github.run_number }} (${{ github.event_name }})

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Do not cancel a long native TDLib build just because another commit is pushed.
concurrency:
  group: vichgram-android-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout VichGram
        uses: actions/checkout@v4

      - name: Confirm workflow started
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          git log -1 --oneline

      - name: Checkout official TDLib source
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master
          path: tdlib-source

      - name: Verify TDLib Android build context
        run: |
          test -f tdlib-source/example/android/Dockerfile
          find tdlib-source/example/android -maxdepth 2 -type f | head -80

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The upstream Dockerfile uses ADD against the GitHub API only to invalidate
      # Docker's cache. BuildKit receives HTTP 403 for that endpoint in this runner.
      # Remove that cache-buster and pass the checked-out TDLib SHA as COMMIT_HASH.
      - name: Prepare TDLib Docker build
        run: |
          sed -i '/^ADD "https:\/\/api.github.com\/repos\/tdlib\/td\/git\/refs\/heads\/master" version.json$/d' tdlib-source/example/android/Dockerfile
          echo "Pinned TDLib commit: $(git -C tdlib-source rev-parse HEAD)"
          ! grep -F 'api.github.com/repos/tdlib/td/git/refs/heads/master' tdlib-source/example/android/Dockerfile

      - name: Build TDLib Android Java/JNI package
        working-directory: tdlib-source/example/android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tdlib-out"
          docker buildx build \
            --platform linux/amd64 \
            --progress plain \
            --build-arg "COMMIT_HASH=$(git -C "$GITHUB_WORKSPACE/tdlib-source" rev-parse HEAD)" \
            --cache-from type=gha,scope=tdlib-android \
            --cache-to type=gha,mode=max,scope=tdlib-android \
            --output "type=local,dest=$GITHUB_WORKSPACE/tdlib-out" \
            .

      - name: Integrate TDLib into Android app
        run: |
          set -eux
          test -s tdlib-out/tdlib.zip
          mkdir -p tdlib-unpacked
          unzip -q tdlib-out/tdlib.zip -d tdlib-unpacked
          test -d tdlib-unpacked/tdlib/java/org/drinkless/tdlib
          test -s tdlib-unpacked/tdlib/libs/arm64-v8a/libtdjni.so
          mkdir -p app/src/main/java/org/drinkless/tdlib
          cp -R tdlib-unpacked/tdlib/java/org/drinkless/tdlib/. app/src/main/java/org/drinkless/tdlib/
          mkdir -p app/src/main/jniLibs
          cp -R tdlib-unpacked/tdlib/libs/. app/src/main/jniLibs/
          echo "Native libraries:"
          find app/src/main/jniLibs -type f -printf '%p %s bytes\n'
          echo "TDLib Java files:"
          find app/src/main/java/org/drinkless/tdlib -maxdepth 1 -type f -printf '%f\n'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Print build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      # Keep a stable debug signing key so updates can be installed over prior builds.
      - name: Restore persistent APK signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vichgram-debug-signing-key-v1

      - name: Build APK with TDLib
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VichGram-apk-and-diagnostics
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vichgram-0.3.${{ github.run_number }}
          name: VichGram 0.3.${{ github.run_number }}
          body: |
            VichGram Android build with official TDLib Java/JNI libraries bundled.
            APK SHA-256 is printed in the workflow log.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
