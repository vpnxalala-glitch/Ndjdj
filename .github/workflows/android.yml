name: Build APK and publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Print build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build APK
        run: gradle --no-daemon --stacktrace --info assembleDebug

      - name: Upload build diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vich-build-diagnostics
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Vich v0.1.${{ github.run_number }}
          body: "Тестовая debug-сборка Vich."
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
